name: Update License Year

on:
  schedule:
    - cron: '0 0 1 1 *'    # Run every January 1st
  workflow_dispatch:        # Allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Update LICENSE/COPYING year
        shell: bash
        run: |
          set -euo pipefail

          current_year="$(date +%Y)"
          mapfile -t files < <(find . -maxdepth 1 -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' \) | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No LICENSE/COPYING files found."
            exit 0
          fi

          for file in "${files[@]}"; do
            echo "Processing $file"
            # Update ranges like 2020-2025 -> 2020-current_year.
            perl -i -pe "s/\b((?:19|20)\d{2})-(?:19|20)\d{2}\b/\$1-${current_year}/g" "$file"
            # Convert standalone years like 2020 -> 2020-current_year.
            perl -i -pe "s/(?<!-)\b((?:19|20)\d{2})\b(?!-)/\$1-${current_year}/g" "$file"
            # Keep current_year as a single year instead of current_year-current_year.
            perl -i -pe "s/\b(${current_year})-${current_year}\b/${current_year}/g" "$file"
          done

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(find . -maxdepth 1 -type f \( -iname 'LICENSE*' -o -iname 'COPYING*' \) | sort)

          if [ "${#files[@]}" -eq 0 ]; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${files[@]}"

          if git diff --cached --quiet; then
            echo "No year update needed."
            exit 0
          fi

          git commit -m "chore: update license year"
          git push